name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: 检查 Python 语法
        run: python -m compileall -q src

      - name: 检查采集脚本语法
        run: |
          for f in collector/*.js; do
            echo "checking $f"
            node --check "$f"
          done

      - name: 跑一遍虚构数据全流程
        run: python src/main.py --demo

      - name: 校验报表内容
        run: |
          python - <<'EOF'
          import glob
          from openpyxl import load_workbook

          files = glob.glob("demo/output/*.xlsx")
          assert files, "没有生成任何报表"

          wb = load_workbook(sorted(files)[-1])
          need = {"互关好友", "我的粉丝", "我的关注", "取关了我", "新粉丝", "我取关了", "历史概览"}
          missing = need - set(wb.sheetnames)
          assert not missing, f"缺少工作表: {missing}"

          # 示例数据设计成：新增 5 个粉丝、4 个人取关了我、我取关 3 个
          assert wb["新粉丝"].max_row - 1 == 5, "新粉丝数不对"
          assert wb["取关了我"].max_row - 1 == 4, "取关了我数不对"
          assert wb["我取关了"].max_row - 1 == 3, "我取关数不对"

          header = [c.value for c in wb["互关好友"][1]]
          for col in ("备注", "昵称", "抖音号", "关系", "账号注册时间"):
              assert col in header, f"缺少列: {col}"

          print("报表校验通过:", wb.sheetnames)
          EOF
