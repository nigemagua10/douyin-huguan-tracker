name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: 检查 Python 语法
        run: python -m compileall -q src

      - name: 检查采集脚本语法
        run: |
          for f in collector/*.js; do
            echo "checking $f"
            node --check "$f"
          done

      - name: 跑一遍虚构数据全流程
        run: python src/main.py --demo

      - name: 校验报表内容
        run: |
          python - <<'EOF'
          import glob
          from openpyxl import load_workbook

          files = glob.glob("demo/output/*.xlsx")
          assert files, "没有生成任何报表"

          wb = load_workbook(sorted(files)[-1])
          need = {"互关好友", "我的粉丝", "我的关注", "取关了我", "新粉丝", "我取关了", "历史概览"}
          missing = need - set(wb.sheetnames)
          assert not missing, f"缺少工作表: {missing}"

          # 示例数据设计成：新增 5 个粉丝、4 个人取关了我、我取关 3 个
          assert wb["新粉丝"].max_row - 1 == 5, "新粉丝数不对"
          assert wb["取关了我"].max_row - 1 == 4, "取关了我数不对"
          assert wb["我取关了"].max_row - 1 == 3, "我取关数不对"

          ws = wb["互关好友"]
          header = [c.value for c in ws[1]]
          for col in ("序号", "备注", "昵称", "抖音号", "关系", "账号注册时间", "简介"):
              assert col in header, f"缺少列: {col}"
          assert header[0] == "序号", "序号必须是第一列"

          # 序号要能用来恢复排序：必须是 1..N 连续
          for sheet in ("互关好友", "我的粉丝", "我的关注", "取关了我", "新粉丝"):
              if sheet not in wb.sheetnames:
                  continue
              s = wb[sheet]
              seq = [s.cell(r, 1).value for r in range(2, s.max_row + 1)]
              assert seq == list(range(1, s.max_row)), \
                  f"{sheet} 的序号不是 1..N: {seq[:8]}"

          # 简介列必须开启自动折行，且原文的换行要原样保留
          si = header.index("简介") + 1
          cells = [ws.cell(r, si) for r in range(2, ws.max_row + 1)]
          assert all(c.alignment.wrap_text for c in cells), "简介列没有开启折行"

          multiline = [(r, str(ws.cell(r, si).value)) for r in range(2, ws.max_row + 1)
                       if ws.cell(r, si).value and "\n" in str(ws.cell(r, si).value)]
          assert multiline, "示例数据里应当有多行简介"
          for r, text in multiline:
              assert ws.row_dimensions[r].height and ws.row_dimensions[r].height > 15, \
                  f"第 {r} 行是多行简介，行高却没有撑开"

          # 全表统一：所有有内容的格子加粗；除「简介」靠左外一律水平居中
          for sheet in wb.sheetnames:
              sh = wb[sheet]
              head = [c.value for c in sh[1]]
              left_idx = head.index("简介") + 1 if "简介" in head else None
              # 表头行始终居中，规则从第 2 行开始套
              for row in sh.iter_rows(min_row=2):
                  for cell in row:
                      if cell.value is None and not cell.hyperlink:
                          continue
                      assert cell.font.bold, f"{sheet}!{cell.coordinate} 未加粗"
                      want = "left" if cell.column == left_idx else "center"
                      assert cell.alignment.horizontal == want, \
                          f"{sheet}!{cell.coordinate} 水平对齐应为 {want}"
              for cell in sh[1]:
                  assert cell.font.bold and cell.alignment.horizontal == "center", \
                      f"{sheet}!{cell.coordinate} 表头未加粗居中"

          # 排序：默认 --sort earliest，互关表应当正好是「接口顺序」的倒序。
          # 接口按「最近关注 -> 最早关注」返回，所以倒过来就是最早在前。
          import json as _json
          raw = _json.load(open(glob.glob("demo/raw/demo_2026-08-20.json")[0], encoding="utf-8"))
          api_order = [u["nickname"] for u in raw["following"]]
          sheet_order = [ws.cell(r, 3).value for r in range(2, ws.max_row + 1)]
          assert sheet_order == api_order[::-1], \
              "互关好友的排序不是接口顺序的倒序（offset 排序或方向判断出错了）"

          # 纯数字的抖音号会触发 Excel「数字以文本形式存储」警告，必须已忽略
          import re, zipfile
          with zipfile.ZipFile(sorted(files)[-1]) as z:
              sheets = [n for n in z.namelist()
                        if re.fullmatch(r"xl/worksheets/sheet\d+\.xml", n)]
              assert sheets, "压缩包里没有工作表"
              for n in sheets:
                  x = z.read(n).decode("utf-8")
                  assert 'numberStoredAsText="1"' in x, f"{n} 缺少 ignoredErrors"

          print(f"报表校验通过: {wb.sheetnames}（多行简介 {len(multiline)} 条，"
                f"{len(sheets)} 个工作表已忽略文本数字警告）")
          EOF
